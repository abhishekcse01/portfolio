<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<title>Color Sequence</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="games.css">
<style>
  .pads{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(100%,380px);aspect-ratio:1}
  .pad{appearance:none;border:0;border-radius:28px;cursor:pointer;opacity:.45;transition:opacity .1s,transform .1s;font-size:42px;
    box-shadow:0 6px 0 rgba(0,0,0,.25)}
  .pad.lit{opacity:1;transform:scale(1.04)}
  .pad:disabled{cursor:default}
  .msg{font-weight:800;font-size:20px;min-height:30px;text-align:center}
</style>
</head>
<body>
<div class="top"><a class="back" href="index.html" aria-label="Back">←</a><h1>🌈 Color Sequence</h1><span style="width:44px"></span></div>
<main class="wrap">
  <div class="seg" id="lvl"><button data-v="easy" class="on">Easy</button><button data-v="hard">Hard</button></div>
  <div class="stats"><div class="stat"><small>Round</small><span id="round">0</span></div><div class="stat"><small>Best</small><span id="best">–</span></div></div>
  <div class="msg" id="msg">Press Start, then copy the pattern!</div>
  <div class="pads" id="pads">
    <button class="pad" data-i="0" style="background:#ef4444" aria-label="red">🍎</button>
    <button class="pad" data-i="1" style="background:#3b82f6" aria-label="blue">🐳</button>
    <button class="pad" data-i="2" style="background:#facc15" aria-label="yellow">🌟</button>
    <button class="pad" data-i="3" style="background:#22c55e" aria-label="green">🐸</button>
  </div>
  <button class="btn" id="go">▶ Start</button>
</main>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
const NOTES = [330, 440, 554, 659];
const SPEED = { easy: 650, hard: 360 };
let level = 'easy', seq = [], pos = 0, accepting = false, playing = false;
const pads = [...document.querySelectorAll('.pad')];
const wait = ms => new Promise(r => setTimeout(r, ms));
function showBest() { $('best').textContent = Arcade.best('simon-' + level).best ?? '–'; }
async function flash(i, ms) {
  pads[i].classList.add('lit'); Arcade.tone(NOTES[i], ms / 1000 * .9, 'sine', .2);
  await wait(ms); pads[i].classList.remove('lit');
}
async function nextRound() {
  accepting = false; pos = 0;
  seq.push(Math.random() * 4 | 0);
  $('round').textContent = seq.length;
  $('msg').textContent = 'Watch… 👀';
  await wait(600);
  const ms = Math.max(220, SPEED[level] - seq.length * 12);
  for (const i of seq) { if (!playing) return; await flash(i, ms); await wait(ms * .35); }
  $('msg').textContent = 'Your turn! 👆';
  accepting = true;
}
function start() {
  seq = []; playing = true; $('go').style.display = 'none';
  nextRound();
}
function gameOver() {
  playing = accepting = false;
  const rounds = seq.length - 1;
  const r = Arcade.best('simon-' + level, rounds); showBest();
  Arcade.sfx.bad(); Arcade.buzz(200);
  $('pads').classList.add('shake'); setTimeout(() => $('pads').classList.remove('shake'), 500);
  $('msg').textContent = 'Oops! Wrong color';
  $('go').style.display = '';
  setTimeout(() => Arcade.modal({ icon: r.isNew ? '🏆' : '🌈', title: r.isNew ? 'New best!' : 'Nice try!', text: `You remembered ${rounds} round${rounds === 1 ? '' : 's'}.`, onBtn: start }), 600);
}
$('pads').addEventListener('pointerdown', e => {
  const p = e.target.closest('.pad'); if (!p || !accepting) return;
  e.preventDefault();
  const i = +p.dataset.i;
  flash(i, 180); Arcade.buzz(10);
  if (i !== seq[pos]) return gameOver();
  pos++;
  if (pos === seq.length) {
    accepting = false;
    $('msg').textContent = ['Great! 🎉', 'Awesome! ⭐', 'Super! 🚀', 'Yes! 💪'][Math.random() * 4 | 0];
    setTimeout(nextRound, 700);
  }
});
$('go').onclick = start;
Arcade.seg($('lvl'), v => { level = v; showBest(); playing = accepting = false; seq = []; $('round').textContent = 0; $('go').style.display = ''; $('msg').textContent = 'Press Start, then copy the pattern!'; });
showBest();
</script>
</body>
</html>
